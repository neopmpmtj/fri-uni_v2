<form method="post" action="{% url 'tubing_length_list' %}">
    {% csrf_token %}
    {% if editing %}<input type="hidden" name="id" value="{{ editing.pk }}">{% endif %}
    {{ form.non_field_errors }}
    <label>
        <span data-i18n="tubingLength">Length</span>
        {{ form.length }}
        {{ form.length.errors }}
    </label>
    <label>
        <span data-i18n="salesPrice">Price</span>
        {{ form.price }}
        {{ form.price.errors }}
    </label>
    <label>
        <span data-i18n="reason">Reason</span>
        {{ form.reason }}
        {{ form.reason.errors }}
    </label>
    <div class="drawer-actions">
        {% if editing and user.can_delete %}
        <button type="submit" name="action" value="delete" class="btn danger" data-i18n="delete">Delete</button>
        {% endif %}
        <button type="submit" name="action" value="save" class="btn primary" data-i18n="save">Save</button>
    </div>
</form>
