<div class="row-actions">
    <div class="row-actions__start">
        {% if proforma.can_edit %}
        <a href="{% url 'proforma_detail' proforma.pk %}" data-i18n="edit">Edit</a>
        {% elif proforma.can_change %}
        <form method="post" action="{% url 'proforma_change' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" class="btn-link" data-i18n="change">Change</button>
        </form>
        {% endif %}
    </div>
    <div class="row-actions__end">
        {% if proforma.can_change %}
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="accept_proforma" class="outcome-icon outcome-icon--accept" title="Mark accepted" aria-label="Mark accepted" data-i18n-aria="markAccepted" data-i18n-title="markAccepted" data-confirm-i18n="confirmMarkAccepted">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 10v12"></path>
                    <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"></path>
                </svg>
            </button>
        </form>
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="reject_proforma" class="outcome-icon outcome-icon--reject" title="Mark rejected" aria-label="Mark rejected" data-i18n-aria="markRejected" data-i18n-title="markRejected" data-confirm-i18n="confirmMarkRejected">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 14V2"></path>
                    <path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22h0a3.13 3.13 0 0 1-3-3.88Z"></path>
                </svg>
            </button>
        </form>
        {% elif proforma.accepted_at %}
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="unaccept_proforma" class="btn-link" data-i18n="clearAccepted">Clear accepted</button>
        </form>
        {% elif proforma.rejected_at %}
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="unreject_proforma" class="btn-link" data-i18n="clearRejected">Clear rejected</button>
        </form>
        {% elif not proforma.can_edit %}
        <span class="muted">—</span>
        {% endif %}
    </div>
</div>
